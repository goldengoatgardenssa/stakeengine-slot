<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#10241f" />
    <title>LE GOATY</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="mark" aria-hidden="true">LG</span>
          <div>
            <h1>LE GOATY</h1>
            <p>Alpine heist</p>
          </div>
        </div>
        <div class="actions">
          <button id="turbo" class="text-btn" type="button" aria-pressed="false">Fast</button>
          <button id="sound" class="icon-btn" type="button" aria-pressed="true" aria-label="Sound on">♪</button>
          <button id="info" class="icon-btn" type="button" aria-label="Game info">i</button>
        </div>
      </header>
      <main class="stage" id="stage">
        <div class="sky" aria-hidden="true">
          <img class="layer l1" alt="" src="assets/art/background/bg_1_sky.webp" />
          <img class="layer l2" alt="" src="assets/art/background/bg_2_peaks.webp" />
          <img class="layer l3" alt="" src="assets/art/background/bg_3_village.webp" />
          <svg class="peaks" viewBox="0 0 1200 500" preserveAspectRatio="none">
            <circle cx="980" cy="80" r="36" fill="#f4e7cf" />
            <polygon points="0,500 160,180 340,500" fill="#1b3e49" />
            <polygon points="220,500 520,70 820,500" fill="#24515c" />
            <polygon points="640,500 960,110 1200,500" fill="#17343d" />
            <rect x="0" y="360" width="1200" height="140" fill="#1c4034" />
            <polygon points="180,360 210,300 250,360" fill="#3a2414" />
            <polygon points="420,360 470,280 530,360" fill="#4a2e18" />
            <polygon points="860,360 910,290 970,360" fill="#3a2414" />
          </svg>
          <div class="clouds"></div>
          <div class="lights"></div>
          <div class="smoke"></div>
        </div>
        <aside id="mascot" class="mascot idle"></aside>
        <div class="frame-wrap">
          <div class="reels" id="reels"></div>
          <img class="frame" alt="" src="assets/art/frame/frame_6x5.webp" />
        </div>
        <div class="hud" id="hud"></div>
        <canvas class="fx" id="fx"></canvas>
        <div class="banner" id="banner"></div>
        <div class="veil hidden" id="veil"></div>
        <div class="replay-controls hidden" id="replay-controls">
          <button id="replay-play" class="text-btn" type="button">Play</button>
        </div>
      </main>
      <footer class="betbar" id="betbar">
        <div class="meter">
          <small id="balance-label">Balance</small>
          <strong id="balance">—</strong>
        </div>
        <div class="meter">
          <small id="win-label">Win</small>
          <strong id="win">—</strong>
        </div>
        <div class="stepper" id="stepper">
          <button id="bet-dec" class="step" type="button" aria-label="Decrease">−</button>
          <div class="meter">
            <small id="bet-label">Bet</small>
            <strong id="bet">—</strong>
          </div>
          <button id="bet-inc" class="step" type="button" aria-label="Increase">+</button>
        </div>
        <div class="actions" id="mode-actions">
          <button id="ante" class="text-btn" type="button" aria-pressed="false">Ante</button>
          <button id="auto" class="text-btn" type="button">Auto</button>
          <button id="heist" class="text-btn" type="button">Heist</button>
          <button id="history" class="text-btn" type="button">History</button>
        </div>
        <button id="spin" class="spin" type="button">Spin</button>
      </footer>
    </div>
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
    <div id="error" class="error hidden" role="alert"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
